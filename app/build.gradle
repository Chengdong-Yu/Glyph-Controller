plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release 签名配置：优先读取仓库根目录的 keystore.properties（已被 .gitignore 忽略），
// 其次读取环境变量 GLYPH_KEYSTORE_FILE / GLYPH_KEYSTORE_PASSWORD / GLYPH_KEY_ALIAS / GLYPH_KEY_PASSWORD。
// 两者都没有时回退到 debug 签名，保证贡献者也能直接构建。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String propKey, String envKey ->
    keystoreProps.getProperty(propKey) ?: System.getenv(envKey)
}
def releaseStoreFile = signingValue('storeFile', 'GLYPH_KEYSTORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'GLYPH_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'GLYPH_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'GLYPH_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword &&
        rootProject.file(releaseStoreFile).exists()

android {
    namespace = 'com.richard.glyphcontroller'
    compileSdk {
        version = release(37) { minorApiLevel = 0 }
    }
    buildFeatures { compose = true }

    defaultConfig {
        applicationId = "com.richard.glyphcontroller"
        minSdk = 33
        targetSdk = 37
        versionCode = 31
        versionName = "1.30"
        resourceConfigurations += ["zh", "en"]
    }

    signingConfigs {
        debug {
        }
        if (hasReleaseSigning) {
            release {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Fails release packaging when the official signing configuration is unavailable.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                    'Release signing is not configured. Add keystore.properties or the GLYPH_KEYSTORE_* environment variables. ' +
                    'Use assembleDebug for an installable development APK.'
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['packageRelease', 'bundleRelease']) {
        task.dependsOn(verifyReleaseSigning)
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    testImplementation 'junit:junit:4.13.2'
}
